name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  spotless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Check formatting
        run: ./gradlew formatCheck
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      # Unit tests run in every Stonecutter node, against that Minecraft version.
      - name: Run unit tests
        run: |
          ./gradlew test
          # Once test sources exist, every node must produce results.
          if [ -d src/test/java ]; then
            for node in versions/*/; do compgen -G "${node}build/test-results/test/TEST-*.xml" > /dev/null; done
          fi
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unit-test-results
          path: |
            versions/*/build/test-results/test/*.xml
            versions/*/build/reports/tests/test/
          if-no-files-found: ignore
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      # Builds every Stonecutter node (Minecraft version).
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: TrajectoryProjected
          path: versions/*/build/libs/*.jar
