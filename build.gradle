import net.fabricmc.loom.task.prod.ClientProductionRunTask

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'com.diffplug.spotless' version '8.10.4'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Optional rendering mods for local runs only: -PwithSodium, -PwithIris (Iris needs Sodium).
    if (project.hasProperty("withSodium") || project.hasProperty("withIris")) runtimeOnly "maven.modrinth:sodium:mc26.2-0.9.2-fabric"
    if (project.hasProperty("withIris")) runtimeOnly "maven.modrinth:iris:1.11.4+26.2-fabric"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    // Minecraft 26.2 uses official names; the normal jar is the distributable artifact.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('sourcesJar') {
    includeEmptyDirs = false
    from("LICENSE")
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }
}

// Development tools live in a separate add-on mod, outside the release jar.
sourceSets {
    dev {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

processDevResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.register('devJar', Jar) {
    archiveBaseName = "${project.archives_base_name}-dev"
    from sourceSets.dev.output
    from("LICENSE") {
        rename { "${it}_${archiveBaseName.get()}" }
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('devJar')
}

loom {
    mods {
        trajectory_projected {
            sourceSet sourceSets.main
        }
        trajectory_projected_dev {
            sourceSet sourceSets.dev
        }
    }
    runs {
        client {
            // Development runs record predicted against real arrows (trajectory-reports/).
            source sourceSets.dev
        }
    }
}

// Native client fixtures live in a separate local mod (src/gametest), outside the release jar.
fabricApi.configureTests {
    createSourceSet = true
    modId = "trajectory_projected_test"
    enableGameTests = false
    enableClientGameTests = true
    eula = true
}

// The local fixtures run with the development add-on, so they can log shots.
sourceSets {
    gametest {
        compileClasspath += dev.output
        runtimeClasspath += dev.output
    }
}

// Starts the built jars from a real mods folder; requires local fixtures.
// The release jar alone by default, with the development add-on under -PsmokeWithDev.
sourceSets {
    releaseSmoke {
        compileClasspath += main.output + main.compileClasspath
    }
}

configurations {
    releaseSmokeMods {
        transitive = false
    }
}

dependencies {
    releaseSmokeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    releaseSmokeMods fabricApi.module("fabric-client-gametest-api-v1", project.fabric_api_version)
}

def releaseSmokeJar = tasks.register('releaseSmokeJar', Jar) {
    archiveBaseName = 'trajectory-projected-release-smoke'
    destinationDirectory = layout.buildDirectory.dir('release-smoke')
    from sourceSets.releaseSmoke.output
}

def syncReleaseSmokeMods = tasks.register('syncReleaseSmokeMods', Sync) {
    from tasks.named('jar'), releaseSmokeJar, configurations.releaseSmokeMods
    if (project.hasProperty('smokeWithDev')) {
        from tasks.named('devJar')
    }
    into layout.buildDirectory.dir('run/releaseSmoke/mods')
}

tasks.register('runReleaseSmoke', ClientProductionRunTask) {
    group = 'verification'
    onlyIf('local fixtures are available') { !sourceSets.releaseSmoke.allJava.empty }
    dependsOn syncReleaseSmokeMods
    jvmArgs.add('-Dfabric.client.gametest')
    if (project.hasProperty('smokeWithDev')) {
        jvmArgs.add('-Dtrajectory.smoke.dev=true')
    }
    runDir = layout.buildDirectory.dir('run/releaseSmoke')
}

apply from: 'gradle/quality.gradle'
