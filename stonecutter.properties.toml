mod.version = "1.1.0"
mod.group = "ru.wilyfox.trajectory"
mod.archives = "trajectory-projected"

deps.fabric_loader = "0.19.3"

["26.1.2"]
# Built against 26.1.2; the same jar runs on 26.1 and 26.1.1.
mod.mc_label = "26.1.x"
mod.mc_compat = "~26.1"
deps.fabric_api = "0.155.3+26.1.2"
# The newest Fabric API for 26.1, so the jar loads there.
deps.fabric_api_min = "0.145.1"
deps.sodium = "mc26.1.2-0.9.2-fabric"
deps.iris = "1.11.4+26.1-fabric"

["26.2"]
# Shown in the jar's version and name.
mod.mc_label = "26.2"
# Compatibility range written into fabric.mod.json.
mod.mc_compat = "~26.2"
deps.fabric_api = "0.161.0+26.2"
# The oldest Fabric API the jar declares.
deps.fabric_api_min = "0.161.0"
# Optional rendering mods for local runs only (-PwithSodium, -PwithIris).
deps.sodium = "mc26.2-0.9.2-fabric"
deps.iris = "1.11.4+26.2-fabric"

["26.3"]
